<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f4ed" />
  <meta name="description" content="A directory of personal apps built on one shared platform." />
  <title>OneAppToRuleThemAll · Personal app directory</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
</head>
<body>
  <svg class="svg-defs" aria-hidden="true"><defs>
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></symbol>
  </defs></svg>
  <div class="layout">
    <div class="content">
      <header class="topbar"><a class="mobile-brand" href="./">OneApp<wbr>ToRule<wbr>ThemAll</a><div class="account"><span id="user-name"></span><button id="auth-button" class="button button-signin" type="button" aria-label="Sign in with Google">Sign in <span aria-hidden="true">↗</span></button></div></header>
      <main id="directory">
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <section class="apps-section" aria-label="Apps"><div class="toolbar"><div class="directory-tools"><button id="add-app" class="button button-primary" hidden><svg><use href="#icon-plus"/></svg>Add app</button><button id="sync-github" class="button button-secondary" hidden>Sync from GitHub ↻</button><button id="check-pages" class="button button-secondary" type="button">Check pages ↻</button></div><div id="filters" class="filters" aria-label="Filter apps by status"><button class="filter active" data-status="all" aria-pressed="true">All apps</button><button class="filter" data-status="live" aria-pressed="false">Live</button><button class="filter" data-status="development" aria-pressed="false">Building</button><button class="filter" data-status="planning" aria-pressed="false">Planned</button><button class="filter" data-status="paused" aria-pressed="false">Paused</button><button class="filter" data-status="archived" aria-pressed="false">Archived</button></div><label class="search"><svg><use href="#icon-search"/></svg><span class="sr-only">Search apps</span><input id="search-apps" type="search" placeholder="Find an app…" autocomplete="off" /></label></div><div id="app-list" class="app-grid" aria-live="polite" aria-busy="true"><div class="empty-state"><div class="empty-mark"><svg><use href="#icon-grid"/></svg></div><h3>Loading apps…</h3><p>Gathering the latest apps and updates.</p></div></div></section>
      </main>
      <footer><span>Made for ideas worth building.</span><span>OneAppToRuleThemAll <i aria-hidden="true">/</i> SHARED PLATFORM</span></footer>
    </div>
  </div>
  <dialog id="app-dialog" aria-labelledby="dialog-title"><form id="app-form"><div class="dialog-heading"><div><span class="eyebrow">YOUR CORNER OF THE ECOSYSTEM</span><h2 id="dialog-title">Add an app</h2></div><button type="button" id="close-dialog" class="icon-button" aria-label="Close app form">×</button></div><p class="form-description">These details appear in the public directory. You’ll own this app’s record.</p><label for="app-repository">GitHub repository</label><input id="app-repository" name="repository" placeholder="harshaxnim/my-app" required maxlength="140" /><label for="app-id">App ID</label><input id="app-id" name="appId" placeholder="my-app" required maxlength="128" /><label for="app-name">App name</label><input id="app-name" name="name" placeholder="A name worth remembering" required maxlength="120" /><div class="branding-fields"><div><label for="app-theme">Theme color</label><input id="app-theme" name="themeColor" type="color" value="#b97053" /></div><div class="icon-field"><label for="app-icon">Icon URL</label><input id="app-icon" name="iconUrl" type="url" placeholder="https://…/icon.svg" maxlength="2048" /></div></div><label for="app-description">Description</label><textarea id="app-description" name="description" rows="3" placeholder="What does it help you do?" maxlength="1000"></textarea><div class="form-row"><div><label for="app-status">Status</label><select id="app-status" name="status"><option value="planning">Planned</option><option value="development">In development</option><option value="live">Live</option><option value="paused">Paused</option><option value="archived">Archived</option></select></div></div><label for="app-url">App URL</label><input id="app-url" name="url" type="url" placeholder="https://harshaxnim.github.io/my-app/" required maxlength="2048" /><p id="form-error" class="form-error" role="alert" hidden></p><div class="dialog-footer"><button id="cancel-dialog" class="button" type="button">Cancel</button><button id="save-app" class="button button-primary" type="submit">Save app</button></div></form></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
