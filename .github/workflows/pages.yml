name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:firebase
      - run: npm run build
      - name: Verify this app was registered during template setup
        run: npm run check:registration
      - name: Wait for any legacy Pages build before publishing Vite
        if: github.event_name == 'push'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy_pages_source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type == "legacy" and .source.branch == "main"')
          if [[ "$legacy_pages_source" != true ]]; then
            exit 0
          fi
          for legacy_attempt in {1..60}; do
            legacy_build_state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status] | if length > 0 and all(. == "completed") then "complete" else "waiting" end')
            if [[ "$legacy_build_state" == complete ]]; then
              exit 0
            fi
            sleep 5
          done
          echo 'The legacy Pages build did not finish before deployment.' >&2
          exit 1
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
